version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - bumpless
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - bumpless
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
